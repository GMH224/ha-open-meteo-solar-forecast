# 0.1.34: static type check of the integration (see DEVELOPER.md).
# The modules added for learning (and the typed runtime) are checked with
# strict optional handling and must stay clean; the older modules are
# checked at Home Assistant's default level.
[mypy]
python_version = 3.13
ignore_missing_imports = True
check_untyped_defs = True
warn_unused_ignores = True
explicit_package_bases = True

[mypy-custom_components.open_meteo_solar_forecast.learning,custom_components.open_meteo_solar_forecast.learning_hub,custom_components.open_meteo_solar_forecast.learning_entities,custom_components.open_meteo_solar_forecast.runtime,custom_components.open_meteo_solar_forecast.switch,custom_components.open_meteo_solar_forecast.energy]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True
