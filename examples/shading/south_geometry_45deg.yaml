# Geometry of the South array (GMH224 installation), version 1: roof pitch 45 deg.
# Superseded by south_geometry.yaml (40 deg, 0.1.34); kept for traceability.
# Frame: metres, x = east, y = north, z = up. Origin = inner eave corner of
# the L-shaped house, where both eaves meet (z = 0 at eave height).
# Fitted on 2026-10-11 to Feb-Oct 2026 hourly production: tall wing width,
# gap between array and valley and chimney position were adjusted until the
# ray-traced losses matched the measured clear-day losses (see
# omsf_v0.1.33.5_release_audit.md, section "South geometry").
version: 1
electrical_model: bypass          # bypass (default) or area

array:
  azimuth: 197                    # compass, the direction the panels face
  tilt: 45
  origin: [-5.818, 2.038, 0.247]  # lower-left corner of the module field, seen from the front
  rows: 5                         # row 1 = bottom
  columns: 3                      # column 1 = left
  module_width: 1.72              # along a row (landscape modules)
  module_height: 1.13             # up the slope
  gap: 0.0
  bypass_diodes: 3
  cell_type: full                 # full or half_cut (data cannot tell; result identical here)
  # strings: one string of all 15 modules (default)

obstacles:
  - type: gable_building          # the tall north-south wing east of the array
    name: tall wing
    center: [5.497, 0.192]        # centre of its footprint
    ridge_azimuth: 358
    length: 18
    width: 11
    eave_height: 0
    ridge_height: 5.5
    bottom: -6

  - type: box
    name: chimney
    center: [2.114, 3.494]
    width: 0.7
    depth: 0.7
    azimuth: 107                  # direction of the width axis (along the eave)
    bottom: 0
    top: 5.9
